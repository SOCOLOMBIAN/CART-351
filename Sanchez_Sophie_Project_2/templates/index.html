<!-- will be a child of base-->
{% extends "base.html" %}

{% block scriptblock %}
<script src="../static/js/index.js" defer></script>
{% endblock %}

{% block content %}
<section class="home-section">
    <div class="home-header">
        <h1>✨ Mystical Tarot Readings ✨</h1>
        <p>Follow the guidance from the cards, discover the answers.</p>
        
        <div class="home-cta">
        <a href="/register" class="btn">Start Your Reading</a>
        </div>
    </div>
    
    <div class="readings-section-home">
        <h2>Collective Readings</h2>
        <p class="readings-count"><span id="readingsCount">0</span> who have found their answers? </p>
        
        <div class="readings-grid" id="readingsContainer">
        <p style="color: rgba(212, 191, 255, 0.7); text-align: center; grid-column: 1/-1;">Loading readings...</p>
        </div>
    </div>
</section>
{% endblock %}
